<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Аудиогид — Музей Мирового океана</title>
  <link rel="icon" href="./content/img/ммо_белый.png" type="image/png" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Кнопка «показать всю территорию» -->
  <button id="fitBtn" class="fab" title="Показать всю территорию" aria-label="Показать всю территорию">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
  </button>

  <!-- Нижний sheet с плеером -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="sheet-handle"></div>

      <button class="close-btn" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>

      <div class="modal-body">
        <h2 id="modalTitle" class="modal-title"></h2>
        <p class="modal-desc"></p>

        <div class="audio-container"></div>

        <div class="player">
          <button class="ctrl-btn play-btn" aria-label="Воспроизвести">
            <svg class="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" hidden>
              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
          </button>

          <div class="progress-block">
            <input type="range" class="progress" value="0" min="0" max="100" step="0.1" aria-label="Прогресс" />
            <div class="time-row">
              <span class="time-current">0:00</span>
              <span class="time-duration">0:00</span>
            </div>
          </div>
        </div>

        <div class="volume-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <input type="range" class="volume" min="0" max="1" step="0.05" value="1" aria-label="Громкость" />
        </div>

        <p class="status"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
